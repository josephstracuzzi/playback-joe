# Builds the macOS apps (Apple Silicon and Intel) on GitHub's Mac runners and attaches them to the release.
# Runs when a release is published, or by hand for an existing tag (Actions > Mac build > Run workflow).
# The apps are signed ad hoc only (no Apple Developer certificate), so macOS asks users to approve them once.
name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v10.27.4)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$TAG" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi

      - run: npm ci

      - name: Build the apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dir --x64 --arm64 -c.mac.identity=null

      # Apple Silicon Macs refuse to run an app with no signature at all, so both get an ad hoc one
      - name: Sign ad hoc and zip
        run: |
          for pair in "mac-arm64:Apple Silicon" "mac:Intel"; do
            dir="${pair%%:*}"; label="${pair#*:}"
            app="dist/$dir/Playback Joe.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ls "$app/Contents/Resources/test_clips"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Playback Joe $VERSION Mac $label.zip"
          done
          ls -la dist/*.zip

      - name: Launch the Apple Silicon app
        run: |
          "dist/mac-arm64/Playback Joe.app/Contents/MacOS/Playback Joe" --user-data-dir="$RUNNER_TEMP/pj" --remote-debugging-port=9223 &
          pid=$!
          for i in $(seq 1 40); do
            curl -s http://127.0.0.1:9223/json > pages.json || true
            if grep -q "PLAYBACK JOE $VERSION - OPERATOR" pages.json; then break; fi
            sleep 1
          done
          cat pages.json
          kill $pid || true
          grep -q "PLAYBACK JOE $VERSION - OPERATOR" pages.json
          grep -q "output.html" pages.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
