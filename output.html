<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PLAYBACK JOE - OUTPUT</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            background: #000; 
            margin: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            user-select: none;
            /* Allows easily dragging and moving the borderless window when not fullscreen */
            -webkit-app-region: drag;
        }
        video, img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: none; 
            pointer-events: none;
            -webkit-app-region: drag;
        }
        #output-fade-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            opacity: 0; 
            pointer-events: none; 
            transition: none; 
            z-index: 999; 
            will-change: opacity;
            transform: translateZ(0);
        }
    </style>
</head>
<body>
    <div id="output-fade-overlay"></div>
    <video id="output-video"></video>
    <img id="output-image" />
    <audio id="output-audio"></audio>

    <script>
        // Supports both contextBridge (window.playbackAPI) and legacy fallback
        const api = window.playbackAPI || (typeof require !== 'undefined' ? {
            sendTimeUpdate: (c, d) => require('electron').ipcRenderer.send('program-timeupdate', c, d),
            sendAudioLevel: (l) => require('electron').ipcRenderer.send('audio-level-update', l),
            autoAdvance: () => require('electron').ipcRenderer.send('auto-advance'),
            onPlayVideo: (cb) => require('electron').ipcRenderer.on('play-video', (e, clip) => cb(clip)),
            onProgramCommand: (cb) => require('electron').ipcRenderer.on('program-command', (e, cmd, val) => cb(cmd, val)),
            onTriggerKill: (cb) => require('electron').ipcRenderer.on('trigger-kill', () => cb()),
            logError: (msg) => require('electron').ipcRenderer.send('log-error', msg),
            reportMediaError: (info) => require('electron').ipcRenderer.send('output-media-error', info)
        } : null);

        api?.getAppVersion?.().then(version => { document.title = `PLAYBACK JOE ${version} - OUTPUT`; });

        const vid = document.getElementById('output-video');
        const img = document.getElementById('output-image');
        const aud = document.getElementById('output-audio');
        const fadeOverlay = document.getElementById('output-fade-overlay');

        let currentClip = null;
        let currentFadeOut = 0;
        let fadeOutStarted = false;
        let currentDuration = 0;
        let lastReportedTime = 0;
        let currentEndBehavior = 'hold';
        let killCleanupTimer = null;

        // ---- Cue IN / OUT points ----
        // A cue with points starts at IN and ends at OUT: fades, HOLD, ADV and LOOP all work from them.
        // A cue without points (inPoint 0, no outPoint) keeps the plain path: native loop, natural end.
        let inPoint = 0;
        let outPoint = null;
        let endHandled = false;   // OUT reached and dealt with (HOLD/ADV), until the next TAKE/seek/PLAY
        // The operator pressed PAUSE (or stepped a frame). Dragging the scrub bar to the end of the file
        // while paused makes the element 'ended'; that must not loop, advance or restart the cue.
        let operatorPaused = false;

        function usesPoints() { return inPoint > 0 || outPoint !== null; }
        function activeEl() { return currentClip?.type === 'audio' ? aud : vid; }
        // Where the cue ends: its OUT point, or the end of the file
        function cueEnd(el) { return outPoint !== null ? outPoint : (el.duration || currentDuration); }

        function applyPoints(clip) {
            inPoint = Math.max(0, Number(clip.inPoint) || 0);
            outPoint = (typeof clip.outPoint === 'number' && clip.outPoint > inPoint) ? clip.outPoint : null;
            endHandled = false;
            const loop = currentEndBehavior === 'loop' && !usesPoints();
            vid.loop = loop && clip.type !== 'audio';
            aud.loop = loop && clip.type === 'audio';
        }

        // Heartbeat: tells main.js this page is alive. If it stops (page frozen), main restarts the output.
        setInterval(() => api?.heartbeat?.(), 1000);

        // Web Audio API Context for true volume boost up to 300% & Real-time VU meter analyzer
        let audioCtx = null;
        let vidGainNode = null;
        let audGainNode = null;
        let analyser = null;
        let animFrameId = null;
        let dataArray = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioCtxClass();

                    vidGainNode = audioCtx.createGain();
                    audGainNode = audioCtx.createGain();

                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    const vidSrc = audioCtx.createMediaElementSource(vid);
                    vidSrc.connect(vidGainNode).connect(analyser);

                    const audSrc = audioCtx.createMediaElementSource(aud);
                    audSrc.connect(audGainNode).connect(analyser);

                    analyser.connect(audioCtx.destination);

                    function broadcastAudioLevel() {
                        if (analyser && dataArray && currentClip && (!vid.paused || !aud.paused)) {
                            analyser.getByteFrequencyData(dataArray);
                            let sum = 0;
                            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                            const avg = sum / dataArray.length;
                            const gainVal = currentClip.gain !== undefined ? currentClip.gain : 1.0;
                            const normalized = (avg / 255) * gainVal * 2.0;
                            api?.sendAudioLevel(normalized);
                        } else {
                            api?.sendAudioLevel(0);
                        }
                        animFrameId = requestAnimationFrame(broadcastAudioLevel);
                    }
                    animFrameId = requestAnimationFrame(broadcastAudioLevel);
                } catch (e) {
                    console.warn("WebAudio init notice:", e);
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function setGain(gainVal, isAudio = false) {
            initAudio();
            const val = Math.max(0, gainVal !== undefined ? gainVal : 1.0);
            const targetNode = isAudio ? audGainNode : vidGainNode;
            
            if (targetNode && audioCtx) {
                // Cancel any KILL fade-out ramp still scheduled, or it would keep pulling the new clip down
                targetNode.gain.cancelScheduledValues(audioCtx.currentTime);
                targetNode.gain.setValueAtTime(val, audioCtx.currentTime);
            } else {
                // Fallback to media element volume (clamped)
                if (isAudio) aud.volume = Math.min(1.0, val);
                else vid.volume = Math.min(1.0, val);
            }
        }

        // ---- Cue audio fades (fade IN / fade OUT sliders) ----
        // The clip's own gain node is ramped alongside the black overlay: up from silence on fade-in,
        // down to silence over the time left on fade-out. Ramps run on the audio clock, so PAUSE freezes
        // them and PLAY picks them up again; a seek, goto-end or loop wrap puts the level back.
        let currentFadeIn = 0;

        function activeGainNode() {
            return currentClip?.type === 'audio' ? audGainNode : vidGainNode;
        }

        function clipGainValue() {
            return Math.max(0, currentClip && currentClip.gain !== undefined ? currentClip.gain : 1.0);
        }

        function rampActiveGain(target, seconds) {
            const node = activeGainNode();
            if (!node || !audioCtx) return;
            const now = audioCtx.currentTime;
            node.gain.cancelScheduledValues(now);
            if (seconds > 0) {
                node.gain.setValueAtTime(node.gain.value, now);
                node.gain.linearRampToValueAtTime(target, now + seconds);
            } else {
                node.gain.setValueAtTime(target, now);
            }
        }

        function freezeActiveGain() {
            const node = activeGainNode();
            if (!node || !audioCtx) return;
            const now = audioCtx.currentTime;
            node.gain.cancelScheduledValues(now);
            node.gain.setValueAtTime(node.gain.value, now);
        }

        function startAudioFadeOut(el) {
            const timeLeft = Math.max(0.05, cueEnd(el) - el.currentTime);
            rampActiveGain(0, timeLeft);
        }

        // A LOOP cue wrapped back to the start after its fade-out began: fade picture and sound back
        // in over what is left of the cue's FADE IN (from wherever the fade-out had got to), or put
        // them straight back to full if it has no fade-in.
        function undoFadeOutOnLoop(el) {
            fadeOutStarted = false;
            const fadeLeft = currentFadeIn - (el.currentTime - inPoint);
            if (fadeLeft > 0.05) {
                if (currentClip?.type === 'audio') {
                    fadeOverlay.style.transition = 'none';
                    fadeOverlay.style.opacity = '0';
                } else {
                    fadeOverlay.style.transition = `opacity ${fadeLeft}s ease`;
                    fadeOverlay.style.opacity = '0';
                }
                rampActiveGain(clipGainValue(), fadeLeft);
            } else {
                fadeOverlay.style.transition = 'none';
                fadeOverlay.style.opacity = '0';
                rampActiveGain(clipGainValue(), 0);
            }
        }

        api?.onPlayVideo((clip) => {
            // A TAKE during a KILL fade cancels the pending KILL cleanup, so it can't blank the new clip
            if (killCleanupTimer) { clearTimeout(killCleanupTimer); killCleanupTimer = null; }
            currentClip = clip;
            operatorPaused = false;
            fadeOutStarted = false;
            currentFadeOut = clip.fadeOut || 0;
            currentEndBehavior = clip.endBehavior || 'hold';
            const fadeIn = clip.fadeIn || 0;
            currentFadeIn = fadeIn;
            applyPoints(clip);
            const rot = clip.rotation || 0;

            vid.pause();
            vid.src = '';
            img.src = '';
            aud.pause();
            aud.src = '';
            vid.style.display = 'none';
            img.style.display = 'none';

            fadeOverlay.style.transition = 'none';
            fadeOverlay.style.opacity = '0';

            if (clip.type === 'image') {
                img.style.display = 'block';
                img.style.transform = `rotate(${rot}deg)`;
                img.src = clip.url;
                currentDuration = 0;
                api.sendTimeUpdate(0, 0);

                if (fadeIn > 0) {
                    fadeOverlay.style.opacity = '1';
                    setTimeout(() => {
                        fadeOverlay.style.transition = `opacity ${fadeIn}s ease`;
                        fadeOverlay.style.opacity = '0';
                    }, 50);
                }
            } else if (clip.type === 'audio') {
                aud.src = clip.url;
                setGain(clip.gain, true);
                if (fadeIn > 0) rampActiveGain(0, 0); // start silent; ramps up once playback starts
                aud.currentTime = inPoint;
                aud.play().then(() => {
                    if (fadeIn > 0 && currentClip === clip) setTimeout(() => { if (currentClip === clip) rampActiveGain(clipGainValue(), fadeIn); }, 50);
                }).catch(err => {
                    // AbortError just means a newer TAKE or KILL replaced this clip
                    if (err.name !== 'AbortError') api.logError(`Output Audio Playback Error: ${err.message}`);
                });
            } else {
                vid.style.display = 'block';
                vid.style.transform = `rotate(${rot}deg)`;
                vid.src = clip.url;
                vid.currentTime = inPoint;
                vid.muted = false;
                setGain(clip.gain, false);

                if (fadeIn > 0) {
                    fadeOverlay.style.opacity = '1';
                    rampActiveGain(0, 0); // start silent; ramps up with the picture
                }

                vid.play().then(() => {
                    if (fadeIn > 0) {
                        setTimeout(() => {
                            if (currentClip !== clip) return;
                            fadeOverlay.style.transition = `opacity ${fadeIn}s ease`;
                            fadeOverlay.style.opacity = '0';
                            rampActiveGain(clipGainValue(), fadeIn);
                        }, 50);
                    }
                }).catch(err => {
                    if (err.name !== 'AbortError') api.logError(`Output Video Playback Error: ${err.message}`);
                });
            }
        });

        // OUTPUT turned on with a cue live: pick it up from the PGM monitor. A paused cue is simply shown
        // at its frame. A playing cue is prerolled: it loads a point just ahead and waits, black and
        // silent, for start-output, so it starts exactly as the PGM copy gets there.
        const AUDIO_SWITCH_S = 0.04;

        function fadeUpFromSilence(level, target, seconds) {
            const node = activeGainNode();
            if (!node || !audioCtx) return;
            const now = audioCtx.currentTime;
            node.gain.cancelScheduledValues(now);
            node.gain.setValueAtTime(0, now);
            node.gain.linearRampToValueAtTime(level, now + AUDIO_SWITCH_S);
            if (seconds > 0) node.gain.linearRampToValueAtTime(target, now + AUDIO_SWITCH_S + seconds);
        }

        api?.onResumeVideo?.((state) => {
            const { clip, position, paused, preroll, level, token } = state;
            if (killCleanupTimer) { clearTimeout(killCleanupTimer); killCleanupTimer = null; }
            currentClip = clip;
            operatorPaused = state.operatorPaused;
            currentFadeOut = clip.fadeOut || 0;
            currentEndBehavior = clip.endBehavior || 'hold';
            currentFadeIn = clip.fadeIn || 0;
            applyPoints(clip);
            endHandled = state.atEnd;
            fadeOutStarted = false;
            lastReportedTime = position;
            fadeOverlay.style.transition = 'none';
            fadeOverlay.style.opacity = preroll ? '1' : String(1 - level);

            let confirmed = false;
            const confirm = () => {
                if (confirmed || currentClip !== clip) return;
                confirmed = true;
                api.outputResumed(token);
            };
            if (clip.type === 'image') {
                img.style.display = 'block';
                img.style.transform = `rotate(${clip.rotation || 0}deg)`;
                img.src = clip.url;
                confirm();
                return;
            }
            const isAudio = clip.type === 'audio';
            const el = isAudio ? aud : vid;
            if (!isAudio) {
                vid.style.display = 'block';
                vid.style.transform = `rotate(${clip.rotation || 0}deg)`;
                vid.muted = false;
            }
            setGain(clip.gain, isAudio);
            rampActiveGain(preroll ? 0 : clipGainValue() * level, 0);
            if (el.getAttribute('src') !== clip.url) el.src = clip.url;
            el.pause();
            el.currentTime = position;
            el.addEventListener('canplay', confirm, { once: true });
            el.addEventListener('seeked', confirm, { once: true });
        });

        // The PGM copy has reached the prerolled point: start, and let the operator know
        api?.onStartOutput?.(({ level, fadeInLeft, fadingOut, token }) => {
            const clip = currentClip;
            if (!clip || clip.type === 'image') return;
            const el = activeEl();
            el.play().then(() => {
                if (currentClip !== clip) return;
                api.outputResumed(token);
                fadeOverlay.style.transition = 'none';
                fadeOverlay.style.opacity = String(1 - level);
                void fadeOverlay.offsetWidth;
                // Fresh fade state: while waiting ahead, a time update may have set off a fade-out
                fadeOutStarted = fadingOut;
                if (fadingOut) {
                    const timeLeft = Math.max(0.05, cueEnd(el) - el.currentTime);
                    fadeOverlay.style.transition = `opacity ${timeLeft}s linear`;
                    fadeOverlay.style.opacity = '1';
                    fadeUpFromSilence(clipGainValue() * level, 0, timeLeft);
                } else if (fadeInLeft > 0) {
                    fadeOverlay.style.transition = `opacity ${fadeInLeft}s ease`;
                    fadeOverlay.style.opacity = '0';
                    fadeUpFromSilence(clipGainValue() * level, clipGainValue(), fadeInLeft);
                } else {
                    fadeUpFromSilence(clipGainValue() * level, 0, 0);
                }
            }).catch(err => {
                if (err.name !== 'AbortError') api.logError(`Output Resume Error: ${err.message}`);
            });
        });

        // A live PDF cue changed page: an instant cut. The new page is decoded first so the old one stays
        // on screen until it can be swapped in one step, and only the newest request counts.
        let pageRequest = 0;

        api?.onShowPage?.((url) => {
            if (currentClip?.type !== 'image') return;
            const clip = currentClip;
            const request = ++pageRequest;
            const next = new Image();
            next.src = url;
            next.decode().catch(() => {}).finally(() => {
                if (request !== pageRequest || currentClip !== clip) return;
                clip.url = url; // the media error checks compare the shown picture with the cue
                img.src = url;
            });
        });

        // Media failure: drop the output to clean black and tell the operator which clip failed.
        // Clearing src ('') on TAKE/KILL also fires 'error' events, so only act when the element
        // still holds the current clip's URL and actually reports a failure.
        const MEDIA_ERROR_TEXT = { 1: 'LOAD ABORTED', 2: 'NETWORK/DISK READ ERROR', 3: 'DECODE ERROR (CORRUPT OR UNSUPPORTED CODEC)', 4: 'FILE MISSING OR FORMAT NOT SUPPORTED' };

        function failToBlack(failedUrl, message) {
            if (!currentClip || currentClip.url !== failedUrl) return;
            const clipName = currentClip.originalName || currentClip.name || failedUrl;
            currentClip = null;
            fadeOutStarted = false;
            vid.pause();
            vid.style.display = 'none';
            aud.pause();
            img.style.display = 'none';
            fadeOverlay.style.transition = 'none';
            fadeOverlay.style.opacity = '1';
            api?.sendTimeUpdate(0, 0);
            if (api?.reportMediaError) api.reportMediaError({ url: failedUrl, message });
            else api?.logError(`Output media error on "${clipName}": ${message}`);
        }

        function onMediaElementError(el) {
            if (!el.error || !currentClip) return;
            if (el.getAttribute('src') !== currentClip.url) return;
            failToBlack(currentClip.url, MEDIA_ERROR_TEXT[el.error.code] || 'UNKNOWN MEDIA ERROR');
        }

        vid.addEventListener('error', () => onMediaElementError(vid));
        aud.addEventListener('error', () => onMediaElementError(aud));
        img.addEventListener('error', () => {
            if (!currentClip || currentClip.type !== 'image') return;
            if (img.getAttribute('src') !== currentClip.url) return;
            if (!img.complete || img.naturalWidth > 0) return;
            failToBlack(currentClip.url, 'IMAGE MISSING OR UNREADABLE');
        });

        // Broadcast timeupdates back to operator console!
        vid.addEventListener('timeupdate', () => {
            currentDuration = vid.duration || 0;
            const cur = vid.currentTime;
            
            // Send timeupdate back to operator console
            api?.sendTimeUpdate(cur, currentDuration);

            // Handle loop wrap-around: undo the fade-out, fading back in if the cue has a fade-in. (Only a
            // real jump back counts, so a clip shorter than its fade-out can't flip the fade on and off
            // near the start. Operator seeks reset the fade in onProgramCommand instead.)
            if (fadeOutStarted && cur < lastReportedTime - 0.5) undoFadeOutOnLoop(vid);
            lastReportedTime = cur;

            // Trigger linear fade-out overlay (picture and sound together), ending at OUT (or the file end).
            // Not when parked beyond OUT (scrubbed past it to move the points), or it would cut to black.
            if (currentFadeOut > 0 && currentDuration > 0) {
                const timeLeft = cueEnd(vid) - cur;
                if (timeLeft <= currentFadeOut && timeLeft > -0.1 && !fadeOutStarted) {
                    fadeOutStarted = true;
                    // Over the time actually left (like the sound), so the picture is fully black at the end
                    fadeOverlay.style.transition = `opacity ${Math.max(0.05, timeLeft)}s linear`;
                    fadeOverlay.style.opacity = '1';
                    startAudioFadeOut(vid);
                }
            }
        });

        aud.addEventListener('timeupdate', () => {
            currentDuration = aud.duration || 0;
            const cur = aud.currentTime;
            api?.sendTimeUpdate(cur, currentDuration);

            if (fadeOutStarted && cur < lastReportedTime - 0.5) undoFadeOutOnLoop(aud);
            lastReportedTime = cur;

            if (currentFadeOut > 0 && currentDuration > 0) {
                const timeLeft = cueEnd(aud) - cur;
                if (timeLeft <= currentFadeOut && timeLeft > -0.1 && !fadeOutStarted) {
                    fadeOutStarted = true;
                    fadeOverlay.style.transition = `opacity ${Math.max(0.05, timeLeft)}s linear`;
                    fadeOverlay.style.opacity = '1';
                    startAudioFadeOut(aud);
                }
            }
        });

        // Trigger Auto-Advance on ended! (unless the OUT watcher below already advanced at OUT)
        vid.addEventListener('ended', () => {
            if (currentEndBehavior === 'advance' && !endHandled && !operatorPaused) {
                endHandled = true;
                api?.autoAdvance();
            }
        });

        aud.addEventListener('ended', () => {
            if (currentEndBehavior === 'advance' && !endHandled && !operatorPaused) {
                endHandled = true;
                api?.autoAdvance();
            }
        });

        // OUT point watcher (only for cues with points). timeupdate fires only ~4x a second, so the
        // position is checked every 10 ms while playing. At OUT: LOOP jumps back to IN, HOLD freezes on
        // the OUT frame, ADV pauses there and asks for the next cue. A LOOP cue with only an IN point
        // also lands here at the end of the file, since the native loop would restart at 0.
        setInterval(() => {
            if (!currentClip || currentClip.type === 'image' || !usesPoints() || endHandled || operatorPaused) return;
            const el = activeEl();
            if (!el.getAttribute('src') || (el.paused && !el.ended)) return;
            // Reached the real file end: HOLD / ADV are handled by 'ended' above, only LOOP needs us
            if (el.ended && currentEndBehavior !== 'loop') return;
            if (!el.ended && el.currentTime < cueEnd(el) - 0.005) return;

            if (currentEndBehavior === 'loop') {
                el.currentTime = inPoint;
                lastReportedTime = inPoint;
                if (fadeOutStarted) undoFadeOutOnLoop(el);
                if (el.paused) el.play().catch(() => {});
            } else if (outPoint !== null) {
                endHandled = true;
                el.pause();
                el.currentTime = outPoint;
                api?.sendTimeUpdate(outPoint, el.duration || currentDuration);
                if (currentEndBehavior === 'advance') api?.autoAdvance();
            }
            // HOLD / ADV with only an IN point end at the file end as before ('ended' above)
        }, 10);

        api?.onProgramCommand((command, value) => {
            if (command === 'play') {
                const el = (currentClip?.type === 'audio') ? aud : vid;
                // PLAY from (or past) OUT, or parked at the end of the file, starts the cue again from IN
                // (left alone, the browser would restart an ended file from 0, not from IN)
                if (usesPoints() && el.currentTime >= cueEnd(el) - 0.05) {
                    el.currentTime = inPoint;
                    fadeOutStarted = false;
                    fadeOverlay.style.transition = 'none';
                    fadeOverlay.style.opacity = '0';
                    rampActiveGain(clipGainValue(), 0);
                }
                endHandled = false;
                operatorPaused = false;
                el.play();
                // Pick up a fade (picture + sound) that was frozen by PAUSE
                const intoCue = el.currentTime - inPoint;
                if (fadeOutStarted) {
                    const timeLeft = Math.max(0.05, cueEnd(el) - el.currentTime);
                    fadeOverlay.style.transition = `opacity ${timeLeft}s linear`;
                    fadeOverlay.style.opacity = '1';
                    startAudioFadeOut(el);
                } else if (currentFadeIn > 0 && intoCue >= 0 && intoCue < currentFadeIn) {
                    const fadeLeft = currentFadeIn - intoCue;
                    if (currentClip?.type !== 'audio') {
                        fadeOverlay.style.transition = `opacity ${fadeLeft}s ease`;
                        fadeOverlay.style.opacity = '0';
                    }
                    rampActiveGain(clipGainValue(), fadeLeft);
                }
            } else if (command === 'pause') {
                operatorPaused = true;
                if (currentClip?.type === 'audio') aud.pause();
                else vid.pause();
                // Freeze any fade where it is, so picture and sound stay together
                const frozenOpacity = getComputedStyle(fadeOverlay).opacity;
                fadeOverlay.style.transition = 'none';
                fadeOverlay.style.opacity = frozenOpacity;
                freezeActiveGain();
            } else if (command === 'seek' || command === 'goto-end') {
                fadeOutStarted = false;
                endHandled = false;
                fadeOverlay.style.transition = 'none';
                fadeOverlay.style.opacity = '0';
                rampActiveGain(clipGainValue(), 0);
                const el = (currentClip?.type === 'audio') ? aud : vid;
                if (command === 'seek') {
                    el.currentTime = value;
                } else if (command === 'goto-end') {
                    // GO TO 20 / 10: seconds before OUT (or the file end)
                    el.currentTime = Math.max(0, cueEnd(el) - value);
                }
            } else if (command === 'audio-out') {
                // The PGM monitor is taking over and this window is about to close
                rampActiveGain(0, value);
            } else if (command === 'set-points' && currentClip && value) {
                // IN / OUT changed on the live cue: takes effect from here on (no jump)
                currentClip.inPoint = value.inPoint;
                currentClip.outPoint = value.outPoint;
                applyPoints(currentClip);
            }
        });

        // KILL: picture and sound both fade out over 1 second, then everything is cleared.
        // The sound ramps the clip's gain node down linearly to silence alongside the black overlay.
        function rampGainToSilence(node, seconds) {
            if (!node || !audioCtx) return;
            const now = audioCtx.currentTime;
            node.gain.cancelScheduledValues(now);
            node.gain.setValueAtTime(node.gain.value, now);
            node.gain.linearRampToValueAtTime(0, now + seconds);
        }

        api?.onTriggerKill(() => {
            fadeOutStarted = false;
            fadeOverlay.style.transition = 'opacity 1s ease';
            fadeOverlay.style.opacity = '1';
            rampGainToSilence(vidGainNode, 1);
            rampGainToSilence(audGainNode, 1);
            if (killCleanupTimer) clearTimeout(killCleanupTimer);
            killCleanupTimer = setTimeout(() => {
                killCleanupTimer = null;
                vid.pause();
                vid.src = '';
                vid.style.display = 'none';
                img.src = '';
                img.style.display = 'none';
                aud.pause();
                aud.src = '';
                fadeOverlay.style.transition = 'none';
                fadeOverlay.style.opacity = '0';
            }, 1000);
        });
    </script>
</body>
</html>
